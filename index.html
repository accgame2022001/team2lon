<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karaoke Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Chủ đề cho từng phòng: đổi biến màu + lớp trang trí nền ===== */
:root{--bg:#0e0b10;--tx:#f4ece4;--a:#e8b44c;--b:#7a1f2b;--deco:none}
.t-hoanggia{--bg:#1d0509;--tx:#fbefd8;--a:#e6b94d;--b:#8c1c2b;--deco:repeating-linear-gradient(90deg,#5c0f1c 0 34px,#7a1426 34px 68px)}
.t-vip1{--bg:#08040f;--tx:#f3e9ff;--a:#ff2bd6;--b:#19e3ff;--deco:repeating-linear-gradient(115deg,transparent 0 40px,rgba(25,227,255,.14) 40px 42px,transparent 42px 90px,rgba(255,43,214,.16) 90px 92px)}
.t-vip2{--bg:#04150f;--tx:#eafbe9;--a:#d9a441;--b:#1f7a52;--deco:radial-gradient(circle at 20% 25%,rgba(217,164,65,.22),transparent 40%),radial-gradient(circle at 80% 75%,rgba(31,122,82,.45),transparent 45%)}
.t-vip3{--bg:#050b1f;--tx:#e8f1ff;--a:#8ec5ff;--b:#4b3fd0;--deco:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#cfe3ff,transparent),radial-gradient(circle at 50% 120%,rgba(75,63,208,.6),transparent 60%);--dsize:140px 140px,140px 140px,auto}
.t-india{--bg:#2a0a24;--tx:#fff3dc;--a:#ff9f1c;--b:#13b5a6;--deco:repeating-conic-gradient(from 0deg at 50% 125%,rgba(255,159,28,.2) 0 6deg,transparent 6deg 12deg)}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--tx);transition:background .6s;min-height:100vh}
.deco{position:fixed;inset:0;background:var(--deco);background-size:var(--dsize,auto);opacity:.85;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.panel{background:color-mix(in srgb,var(--bg) 78%,#000);border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-radius:14px}
.btn{background:var(--a);color:#150a10;font-weight:700;border-radius:10px;padding:.45rem .9rem}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--a)}
.btn:disabled{opacity:.4}
.rc{position:relative;overflow:hidden;border-radius:16px;background:var(--bg);border:2px solid var(--a);cursor:pointer;color:var(--tx);min-height:150px}
.rc::before{content:'';position:absolute;inset:0;background:var(--deco);background-size:var(--dsize,auto)}
.rc>div{position:relative}
/* ===== Lời karaoke: dòng hiện tại tô màu dần theo biến --p ===== */
.ly{font-weight:800;text-align:center;line-height:1.25;transition:opacity .3s}
.ly.cur{font-size:clamp(1.6rem,4.2vw,2.6rem);background:linear-gradient(90deg,var(--a) var(--p,0%),rgba(255,255,255,.35) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.ly.nx{font-size:clamp(1.1rem,2.6vw,1.6rem);opacity:.55}
.ly.pv{font-size:1rem;opacity:.3}
input,textarea{background:rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:8px;padding:.4rem .6rem;width:100%;color:var(--tx)}
</style>
</head>
<body class="t-vip1">
<div class="deco"></div>
<div class="wrap max-w-6xl mx-auto p-3">

<!-- ===== SẢNH: danh sách phòng ===== -->
<section id="lobby">
  <h1 class="text-3xl font-extrabold mt-4">Karaoke Online</h1>
  <div class="flex gap-2 items-center my-3">
    <span>Tên của bạn</span><input id="nm" class="max-w-[220px]" maxlength="24">
  </div>
  <div id="rooms" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
</section>

<!-- ===== PHÒNG HÁT ===== -->
<section id="room" class="hidden">
  <div class="flex items-center gap-3 mb-3">
    <button class="btn ghost" onclick="leave()">Về sảnh</button>
    <h2 id="rname" class="text-2xl font-extrabold flex-1"></h2>
    <button class="btn ghost" onclick="openAdd()">Thêm bài hát</button>
  </div>
  <div class="grid lg:grid-cols-3 gap-3">
    <div class="lg:col-span-2 space-y-3">
      <div class="panel p-3">
        <div class="flex gap-3 flex-wrap items-start">
          <div class="w-48 aspect-video bg-black rounded-lg overflow-hidden"><div id="yt"></div></div>
          <div class="flex-1 min-w-[180px]">
            <div id="now" class="font-semibold">Chưa có ai hát. Hãy đặt một bài!</div>
            <div class="flex gap-2 mt-2">
              <button id="go" class="btn hidden" onclick="sing()">Bắt đầu hát</button>
              <button id="skip" class="btn ghost hidden" onclick="skipMine()">Bỏ bài</button>
            </div>
            <div class="mt-2 h-2 rounded bg-black/40 overflow-hidden"><div id="vu" class="h-full" style="width:0;background:var(--b)"></div></div>
            <div class="text-sm opacity-70 mt-1">Dùng tai nghe để micro không thu tiếng loa.</div>
          </div>
          <div class="text-right">
            <div id="score" class="text-5xl font-extrabold" style="color:var(--a)">0</div>
            <div id="rate" class="text-sm h-5"></div>
            <div id="combo" class="text-xs opacity-70"></div>
          </div>
        </div>
      </div>
      <div class="panel p-5 min-h-[260px] flex flex-col justify-center gap-3" id="stage">
        <div id="l0" class="ly pv"></div><div id="l1" class="ly cur">Lời bài hát sẽ chạy ở đây</div>
        <div id="l2" class="ly nx"></div><div id="l3" class="ly nx"></div>
      </div>
    </div>
    <div class="space-y-3">
      <div class="panel p-3"><b>Hàng chờ</b><div id="queue" class="text-sm mt-1 space-y-1"></div></div>
      <div class="panel p-3"><b>Thư viện bài hát</b>
        <input id="q" class="mt-1" placeholder="Tìm bài hoặc ca sĩ" oninput="renderSongs()">
        <div id="songs" class="text-sm mt-2 space-y-1 max-h-56 overflow-auto"></div>
      </div>
      <div class="panel p-3"><b>Trong phòng</b><div id="mem" class="text-sm mt-1"></div></div>
      <div class="panel p-3"><b>Bảng xếp hạng phòng</b><div id="board" class="text-sm mt-1 space-y-1"></div></div>
    </div>
  </div>
</section>
</div>

<!-- ===== Hộp thoại thêm bài + đồng bộ lời ===== -->
<div id="add" class="hidden fixed inset-0 z-20 bg-black/70 overflow-auto p-3">
  <div class="panel max-w-xl mx-auto p-4 space-y-2" style="background:var(--bg)">
    <b class="text-lg">Thêm bài hát từ YouTube</b>
    <input id="aurl" placeholder="Link YouTube (bản karaoke/beat)">
    <div class="flex gap-2"><input id="atit" placeholder="Tên bài"><input id="aart" placeholder="Ca sĩ"></div>
    <textarea id="alrc" rows="8" placeholder="Dán lời. Dạng có mốc: [01:23.50] lời... Hoặc dán lời thường rồi bấm Đồng bộ."></textarea>
    <div class="flex gap-2 flex-wrap">
      <button class="btn ghost" onclick="syncStart()">Đồng bộ lời theo nhạc</button>
      <button id="stamp" class="btn hidden" onclick="stamp()">Đánh dấu dòng tiếp theo</button>
      <span id="sinfo" class="text-sm self-center"></span>
    </div>
    <div id="yt2" class="hidden w-64 aspect-video"></div>
    <div class="flex gap-2 justify-end">
      <button class="btn ghost" onclick="closeAdd()">Đóng</button>
      <button class="btn" onclick="saveSong()">Lưu bài</button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ===== Tiện ích chung =====
const $ = id => document.getElementById(id);
const ROOMDESC = {
  hoanggia: 'Nhung đỏ, ánh vàng, sọc rèm sân khấu',
  vip1: 'Đèn neon và tia laser của câu lạc bộ đêm',
  vip2: 'Lục bảo và đồng thau, ánh đèn ấm',
  vip3: 'Bầu trời đêm đầy sao',
  india: 'Hoa văn mandala vàng cam và xanh ngọc'
};
/** DÁN URL Web App của Apps Script (kết thúc bằng /exec) vào đây */
const API_URL = 'https://script.google.com/macros/s/AKfycbycoWjVuVaFGuffEGyqwqQKWhefpQ2BycYxw9UQ_EQ8gVrLr4gP2mG02zLcdqxdM0VTxA/exec';
/** Gọi hàm backend qua fetch. Dùng text/plain để tránh lỗi CORS preflight */
const api = async (fn, ...args) => {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)) throw new Error('Chưa cấu hình API_URL trong index.html');
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) });
  const r = await res.json();
  if (!r || !r.ok) throw new Error((r && r.error) || 'Lỗi không rõ');
  return r.data;
};
const toast = m => alert(m);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid, S = { rooms: [], songs: [], room: null, st: null, lines: [], curId: null, mine: false };
try { uid = localStorage.getItem('kid') || (localStorage.kid = Math.random().toString(36).slice(2, 10)); } catch (e) { uid = Math.random().toString(36).slice(2, 10); }
const myName = () => ($('nm').value.trim() || 'Khách ' + uid.slice(0, 3));
try { $('nm').value = localStorage.getItem('kname') || ''; } catch (e) {}
$('nm').onchange = () => { try { localStorage.kname = $('nm').value; } catch (e) {} };

// ===== Sảnh =====
async function loadLobby() {
  try {
    const d = await api('getBootstrap');
    S.rooms = d.rooms; S.songs = d.songs;
    $('rooms').innerHTML = d.rooms.map(r => `
      <div class="rc t-${r.id}" onclick="enter('${r.id}')"><div class="p-4">
        <div class="text-2xl font-extrabold">${esc(r.name)}</div>
        <div class="text-sm opacity-80 mt-1">${ROOMDESC[r.id] || ''}</div>
        <div class="mt-6 font-semibold" style="color:var(--a)">${r.online}/${r.cap} người</div>
      </div></div>`).join('');
  } catch (e) { toast('Không tải được danh sách phòng: ' + e.message); }
}

// ===== Vào / rời phòng =====
let poll = null;
function enter(id) {
  const r = S.rooms.find(x => x.id === id); if (!r) return;
  S.room = r; document.body.className = 't-' + id;
  $('lobby').classList.add('hidden'); $('room').classList.remove('hidden');
  $('rname').textContent = 'Phòng ' + r.name;
  renderSongs(); tick(); poll = setInterval(tick, 3000);
}
function leave() {
  clearInterval(poll); stopAll();
  S.room = null; document.body.className = 't-vip1';
  $('room').classList.add('hidden'); $('lobby').classList.remove('hidden'); loadLobby();
}
async function tick() {
  if (!S.room) return;
  try { S.st = await api('getRoomState', S.room.id, uid, myName()); renderRoom(); } catch (e) { console.warn(e); }
}

// ===== Hiển thị hàng chờ, thành viên, bảng xếp hạng =====
function renderRoom() {
  const st = S.st, cur = st.queue.find(q => q.status === 'playing') || st.queue[0];
  $('queue').innerHTML = st.queue.map((q, i) =>
    `<div>${i + 1}. <b>${esc(q.song ? q.song.title : '?')}</b> - ${esc(q.singer)}${q.status === 'playing' ? ' (đang hát)' : ''}</div>`).join('') || '<i class="opacity-60">Trống</i>';
  $('mem').textContent = st.members.join(', ');
  $('board').innerHTML = st.board.map((b, i) => `<div>${i + 1}. ${esc(b.singer)} - ${b.score} <span class="opacity-60">${esc(b.title)}</span></div>`).join('') || '<i class="opacity-60">Chưa có điểm</i>';
  const mine = !!cur && cur.singerId === uid;
  $('go').classList.toggle('hidden', !(mine && cur.status === 'waiting'));
  $('skip').classList.toggle('hidden', !mine);
  $('now').textContent = cur ? `${cur.status === 'playing' ? 'Đang hát' : 'Tiếp theo'}: ${cur.singer} - ${cur.song ? cur.song.title : ''}` : 'Chưa có ai hát. Hãy đặt một bài!';
  // Người xem: tự phát và căn theo giờ máy chủ
  if (cur && cur.status === 'playing' && !mine) watch(cur, st.now);
  if (!cur || (cur.id !== S.curId && S.curId && !mine)) { if (!cur) stopAll(); }
}
function renderSongs() {
  const k = ($('q').value || '').toLowerCase();
  $('songs').innerHTML = S.songs.filter(s => (s.title + s.artist).toLowerCase().includes(k)).slice(0, 60).map(s =>
    `<div class="flex gap-2 items-center"><span class="flex-1">${esc(s.title)} <span class="opacity-60">${esc(s.artist)}</span></span>
     <button class="btn" onclick="order('${s.id}')">Đặt</button></div>`).join('') || '<i class="opacity-60">Chưa có bài. Bấm Thêm bài hát.</i>';
}
async function order(id) {
  try { await api('enqueue', S.room.id, id, uid, myName()); tick(); } catch (e) { toast(e.message); }
}

// ===== YouTube player =====
let yt = null, ytReady = false, curVid = null;
function onYouTubeIframeAPIReady() { ytReady = true; }
function loadVideo(vid, start) {
  return new Promise(res => {
    if (!ytReady) return toast('YouTube chưa tải xong, thử lại sau vài giây');
    if (yt && yt.loadVideoById) { yt.loadVideoById({ videoId: vid, startSeconds: start || 0 }); curVid = vid; return res(); }
    yt = new YT.Player('yt', { width: '100%', height: '100%', videoId: vid,
      playerVars: { controls: 0, rel: 0, playsinline: 1, autoplay: 1, start: Math.floor(start || 0) },
      events: { onReady: e => { e.target.playVideo(); res(); }, onStateChange: onYtState } });
    curVid = vid;
  });
}
function onYtState(e) { if (e.data === 0 && S.mine) endSong(); }   // 0 = video kết thúc

function parseLrc(t) {
  const out = [];
  (t || '').split(/\r?\n/).forEach(l => {
    const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
    if (m) out.push({ t: +m[1] * 60 + parseFloat(m[2]), text: m[3].trim() });
  });
  return out.sort((a, b) => a.t - b.t);
}

// ===== Người hát: mở mic, phát nhạc, chấm điểm =====
async function sing() {
  const cur = S.st.queue[0]; if (!cur || !cur.song) return;
  try { await startMic(); } catch (e) { return toast('Không mở được micro. Hãy cho phép truy cập micro và thử lại. (' + e.message + ')'); }
  try {
    await api('startSong', cur.id);
    S.mine = true; S.curId = cur.id; S.lines = parseLrc(cur.song.lrc); resetScore();
    await loadVideo(cur.song.videoId, 0); loop();
  } catch (e) { toast(e.message); }
}
function watch(cur, serverNow) {
  const target = (serverNow - cur.startedAt) / 1000;
  if (S.curId !== cur.id) {
    S.curId = cur.id; S.mine = false; S.lines = parseLrc(cur.song && cur.song.lrc);
    if (cur.song) loadVideo(cur.song.videoId, Math.max(0, target)).then(loop);
  } else if (yt && yt.getCurrentTime && Math.abs(yt.getCurrentTime() - target) > 3) yt.seekTo(Math.max(0, target), true);
}
async function endSong() {
  const id = S.curId; S.mine = false; const sc = total();
  try { await api('finishSong', id, sc); toast('Điểm của bạn: ' + sc); } catch (e) { toast(e.message); }
  stopAll(); tick();
}
async function skipMine() {
  const cur = S.st.queue[0]; if (!cur) return;
  try { await api('skipSong', cur.id); } catch (e) { toast(e.message); }
  stopAll(); tick();
}
function stopAll() {
  S.mine = false; S.curId = null; S.lines = [];
  try { yt && yt.stopVideo && yt.stopVideo(); } catch (e) {}
  cancelAnimationFrame(raf); clearInterval(micT);
  ['l0', 'l2', 'l3'].forEach(i => $(i).textContent = ''); $('l1').textContent = 'Lời bài hát sẽ chạy ở đây'; $('l1').style.setProperty('--p', '0%');
}

// ===== Vòng lặp hiển thị lời (mỗi khung hình) =====
let raf = 0, idx = -1;
function loop() {
  cancelAnimationFrame(raf);
  const L = S.lines;
  const f = () => {
    if (!yt || !yt.getCurrentTime) return (raf = requestAnimationFrame(f));
    const t = yt.getCurrentTime(); let i = -1;
    for (let k = 0; k < L.length; k++) if (L[k].t <= t) i = k; else break;
    if (i !== idx) { closeLine(idx); idx = i; openLine(i); }
    if (i >= 0 && L.length) {
      const end = L[i + 1] ? L[i + 1].t : L[i].t + 5;
      $('l1').style.setProperty('--p', Math.min(100, (t - L[i].t) / (end - L[i].t) * 100) + '%');
    }
    raf = requestAnimationFrame(f);
  };
  idx = -2; f();
}
function openLine(i) {
  const L = S.lines, g = k => (L[k] ? L[k].text : '');
  $('l0').textContent = g(i - 1);
  $('l1').textContent = i >= 0 ? (g(i) || '♪') : (L.length ? '♪' : 'Bài này chưa có lời đồng bộ');
  $('l2').textContent = g(i + 1); $('l3').textContent = g(i + 2);
  lineAcc = { n: 0, v: 0, pairs: 0, stable: 0 };
}

// ===== Chấm điểm: micro -> cao độ (tự tương quan) -> điểm từng dòng =====
let ctx, an, buf, micT, lineAcc = { n: 0, v: 0, pairs: 0, stable: 0 }, prevSt = null, scores = [], combo = 0;
async function startMic() {
  if (ctx) return ctx.resume();
  const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false } });
  ctx = new AudioContext(); an = ctx.createAnalyser(); an.fftSize = 2048;
  ctx.createMediaStreamSource(s).connect(an); buf = new Float32Array(an.fftSize);
}
function resetScore() {
  scores = []; combo = 0; prevSt = null; $('score').textContent = '0'; $('rate').textContent = ''; $('combo').textContent = '';
  clearInterval(micT); micT = setInterval(sample, 50);
}
/** Trả về tần số (Hz) nếu đang có tiếng hát có cao độ rõ, ngược lại 0 */
function detect() {
  an.getFloatTimeDomainData(buf);
  let e = 0; for (let i = 0; i < buf.length; i++) e += buf[i] * buf[i];
  const rms = Math.sqrt(e / buf.length); $('vu').style.width = Math.min(100, rms * 400) + '%';
  if (rms < 0.015) return 0;
  const sr = ctx.sampleRate, lo = Math.floor(sr / 1000), hi = Math.floor(sr / 80);
  let best = 0, bl = 0;
  for (let lag = lo; lag < hi; lag++) {
    let c = 0, n = 0;
    for (let i = 0; i < buf.length - lag; i += 2) { c += buf[i] * buf[i + lag]; n += buf[i] * buf[i]; }
    const r = c / (n || 1); if (r > best) { best = r; bl = lag; }
  }
  return best > 0.8 ? sr / bl : 0;
}
function sample() {
  if (!S.mine || idx < 0 || !S.lines[idx] || !S.lines[idx].text) return;
  const f = detect(); lineAcc.n++;
  if (f) {
    lineAcc.v++; const st = 12 * Math.log2(f / 440);
    if (prevSt !== null) { lineAcc.pairs++; if (Math.abs(st - prevSt) < 2) lineAcc.stable++; }
    prevSt = st;
  } else prevSt = null;
}
/** Chốt điểm dòng vừa hát: 75% theo độ phủ giọng hát + 25% theo độ ổn định cao độ */
function closeLine(i) {
  if (!S.mine || i < 0 || !S.lines[i] || !S.lines[i].text || !lineAcc.n) return;
  const ratio = lineAcc.v / lineAcc.n, stab = lineAcc.stable / Math.max(1, lineAcc.pairs);
  const sc = Math.min(1, ratio / 0.55) * 100 * (0.75 + 0.25 * stab);
  scores.push(sc); combo = sc >= 70 ? combo + 1 : 0;
  $('score').textContent = total();
  $('rate').textContent = sc >= 90 ? 'Hoàn hảo' : sc >= 70 ? 'Tốt' : sc >= 50 ? 'Khá' : 'Cố lên';
  $('combo').textContent = combo > 1 ? 'Chuỗi ' + combo + ' dòng tốt' : '';
}
const total = () => scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;

// ===== Thêm bài hát + công cụ đồng bộ lời =====
let yt2 = null, sLines = [], sOut = [];
const vidId = u => { const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : ''); };
function openAdd() { $('add').classList.remove('hidden'); }
function closeAdd() { $('add').classList.add('hidden'); try { yt2 && yt2.stopVideo(); } catch (e) {} }
function syncStart() {
  const v = vidId($('aurl').value.trim()); if (!v) return toast('Hãy nhập link YouTube trước');
  sLines = $('alrc').value.split(/\r?\n/).map(l => l.replace(/^\[[^\]]*\]/, '').trim()).filter(Boolean);
  if (!sLines.length) return toast('Hãy dán lời bài hát trước');
  sOut = []; $('yt2').classList.remove('hidden'); $('stamp').classList.remove('hidden');
  const mk = () => { yt2 = new YT.Player('yt2', { width: '100%', height: '100%', videoId: v, playerVars: { playsinline: 1 }, events: { onReady: e => e.target.playVideo() } }); };
  if (yt2 && yt2.loadVideoById) yt2.loadVideoById(v); else mk();
  $('sinfo').textContent = 'Nghe nhạc, khi lời dòng đầu bắt đầu thì bấm Đánh dấu (hoặc phím Space).';
}
function stamp() {
  if (!yt2 || sOut.length >= sLines.length) return;
  const t = yt2.getCurrentTime(), m = Math.floor(t / 60), s = (t - m * 60).toFixed(2).padStart(5, '0');
  sOut.push(`[${String(m).padStart(2, '0')}:${s}] ${sLines[sOut.length]}`);
  $('alrc').value = sOut.join('\n');
  $('sinfo').textContent = sOut.length < sLines.length ? 'Dòng kế: ' + sLines[sOut.length] : 'Đã đồng bộ xong. Bấm Lưu bài.';
}
document.addEventListener('keydown', e => { if (e.code === 'Space' && !$('stamp').classList.contains('hidden') && !$('add').classList.contains('hidden') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); stamp(); } });
async function saveSong() {
  const v = vidId($('aurl').value.trim());
  if (!v) return toast('Link YouTube không hợp lệ');
  if (!$('atit').value.trim()) return toast('Hãy nhập tên bài');
  try {
    await api('addSong', { videoId: v, title: $('atit').value.trim(), artist: $('aart').value.trim(), lrc: $('alrc').value, addedBy: myName() });
    toast('Đã lưu bài hát'); closeAdd(); ['aurl', 'atit', 'aart', 'alrc'].forEach(i => $(i).value = '');
    S.songs = (await api('getBootstrap')).songs; renderSongs();
  } catch (e) { toast(e.message); }
}
loadLobby();
</script>
